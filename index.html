<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE TOONS - عالم الكرتون</title>
    <style>
        :root {
            --bg-dark: #0a0f1a;
            --bg-card: #16213e;
            --accent: #00d2ff;
            --accent-dark: #007bb5;
            --text-main: #e0f2f1;
            --text-dim: #b0bec5;
            --transition: all 0.3s ease;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(to bottom, #1a2a4a, transparent);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .nav-btn {
            background: var(--bg-card);
            border: 2px solid transparent;
            color: var(--text-main);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: bold;
        }
        .nav-btn:focus, .nav-btn.active {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transform: scale(1.1);
            outline: none;
        }
        .container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            flex: 1;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            border: 3px solid transparent;
            position: relative;
            aspect-ratio: 2/3;
        }
        .card:focus, .card:hover {
            border-color: var(--accent);
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            outline: none;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 15px;
            font-size: 0.9rem;
            text-align: center;
            font-weight: bold;
        }
        .search-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .search-bar input {
            width: 60%;
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background: var(--bg-card);
            color: white;
            font-size: 1rem;
            outline: none;
            border: 2px solid transparent;
        }
        .search-bar input:focus {
            border-color: var(--accent);
        }
        .search-bar button {
            background: var(--accent);
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            color: var(--bg-dark);
            font-weight: bold;
            cursor: pointer;
        }
        .letter-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .letter-btn {
            width: 50px;
            height: 50px;
            background: var(--bg-card);
            border: 2px solid transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: var(--transition);
        }
        .letter-btn:focus, .letter-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dark);
            outline: none;
        }
        #player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        video {
            width: 100%;
            height: 100%;
            outline: none;
        }
        .close-player {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            z-index: 1100;
            font-weight: bold;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            color: var(--accent);
            margin: 50px 0;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
            font-size: 0.8rem;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(0, 210, 255, 0.1);
        }
        .version-tag {
            color: var(--accent);
            font-weight: bold;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="app-logo">ICE TOONS</div>
        <nav>
            <button class="nav-btn active" data-page="series">المسلسلات</button>
            <button class="nav-btn" data-page="movies">الأفلام</button>
            <button class="nav-btn" data-page="letters">الحروف</button>
            <button class="nav-btn" data-page="random">قناة عشوائية</button>
        </nav>
    </header>

    <div class="container">
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="ابحث عن كرتونك المفضل...">
            <button id="search-btn">بحث</button>
        </div>

        <div id="content-area"></div>
    </div>

    <footer>
        <div>ICE TOONS &copy; 2024 - عالم الكرتون المجاني</div>
        <div class="version-tag">Version 1.0.5 (Stable) ❄️</div>
    </footer>

    <div id="player-container">
        <button class="close-player" id="close-player">إغلاق ✖</button>
        <video id="main-video" controls autoplay></video>
    </div>

    <script>
        const BASE_URL = 'https://www.dimakids.com/';
        const PROXY = 'https://script.google.com/macros/s/AKfycbz-tAbbdUeeF6LXwWwZF3fJ6DjGtQKOxLad3d51UDzU4FigyHIXdExBLEUho6e6HRzq/exec?url='; 
        
        let currentView = 'series';
        let currentPage = 1;

        const contentArea = document.getElementById('content-area');
        const logo = document.getElementById('app-logo');
        const navBtns = document.querySelectorAll('.nav-btn');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const playerContainer = document.getElementById('player-container');
        const mainVideo = document.getElementById('main-video');
        const closePlayer = document.getElementById('close-player');

        async function fetchPage(url) {
            const fullUrl = url.startsWith('http') ? url : BASE_URL + url;
            try {
                const response = await fetch(PROXY + encodeURIComponent(fullUrl), {
                    mode: 'cors',
                    cache: 'no-cache',
                    headers: {
                        'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
                    }
                });
                if (!response.ok) throw new Error('Network response was not ok');
                return await response.text();
            } catch (e) {
                console.error('Error fetching page:', e);
                return null;
            }
        }

        function parseHTML(html) {
            const parser = new DOMParser();
            return parser.parseFromString(html, 'text/html');
        }

        function extractItems(doc, fullUrl) {
            const items = [];
            const grid = doc.querySelector('.series-grid-swiper') || doc.querySelector('.search-results-container');
            const links = grid ? grid.querySelectorAll('a[href]') : doc.querySelectorAll('a[href*=".html"]');

            links.forEach(item => {
                const title = item.getAttribute('title') || item.innerText.trim();
                const href = item.getAttribute('href');
                if (!href || href.includes('javascript') || href === '#') return;
                const link = href.startsWith('http') ? href : (fullUrl.endsWith('/') ? fullUrl + href : fullUrl + '/' + href);
                const img = item.querySelector('img');
                let thumb = img ? img.getAttribute('src') : '';
                if (thumb && !thumb.startsWith('http')) thumb = BASE_URL + thumb;
                if (title) items.push({ title, link, thumb });
            });
            return items;
        }

        async function loadSeries(page = 1) {
            currentPage = page;
            contentArea.innerHTML = '<div class="loading">جاري التحميل... ❄️</div>';
            const url = page === 1 ? 'cartoon.php' : `cartoon.php?page=${page}`;
            const html = await fetchPage(url);
            if (!html) {
                contentArea.innerHTML = '<div class="loading">حدث خطأ أثناء التحميل، يرجى تحديث الصفحة. ❄️</div>';
                return;
            }
            const doc = parseHTML(html);
            const items = extractItems(doc, BASE_URL);
            renderGrid(items, 'series');
        }

        async function loadMovies(page = 1) {
            currentPage = page;
            contentArea.innerHTML = '<div class="loading">جاري التحميل... ❄️</div>';
            const url = page === 1 ? 'movies.php' : `movies.php?page=${page}`;
            const html = await fetchPage(url);
            if (!html) {
                contentArea.innerHTML = '<div class="loading">حدث خطأ أثناء التحميل، يرجى تحديث الصفحة. ❄️</div>';
                return;
            }
            const doc = parseHTML(html);
            const items = extractItems(doc, BASE_URL);
            renderGrid(items, 'movies');
        }

        async function loadLetters() {
            contentArea.innerHTML = '<div class="loading">جاري التحميل... ❄️</div>';
            const letters = [
                {l: "الكل", u: "all-tri.html"}, {l: "ا", u: "0-tri.html"}, {l: "ب", u: "1-tri.html"}, {l: "ت", u: "2-tri.html"},
                {l: "ث", u: "3-tri.html"}, {l: "ج", u: "4-tri.html"}, {l: "ح", u: "5-tri.html"}, {l: "خ", u: "6-tri.html"},
                {l: "د", u: "7-tri.html"}, {l: "ذ", u: "8-tri.html"}, {l: "ر", u: "9-tri.html"}, {l: "ز", u: "10-tri.html"},
                {l: "س", u: "11-tri.html"}, {l: "ش", u: "12-tri.html"}, {l: "ص", u: "13-tri.html"}, {l: "ض", u: "14-tri.html"},
                {l: "ط", u: "15-tri.html"}, {l: "ع", u: "16-tri.html"}, {l: "غ", u: "17-tri.html"}, {l: "ف", u: "18-tri.html"},
                {l: "ق", u: "19-tri.html"}, {l: "ك", u: "20-tri.html"}, {l: "ل", u: "21-tri.html"}, {l: "م", u: "22-tri.html"},
                {l: "ن", u: "23-tri.html"}, {l: "ه", u: "24-tri.html"}, {l: "و", u: "25-tri.html"}, {l: "ي", u: "26-tri.html"}
            ];
            const grid = document.createElement('div');
            grid.className = 'letter-grid';
            letters.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.innerText = item.l;
                btn.onclick = () => loadByLetter(item.u);
                btn.tabIndex = 0;
                grid.appendChild(btn);
            });
            contentArea.innerHTML = '';
            contentArea.appendChild(grid);
        }

        async function loadByLetter(url) {
            contentArea.innerHTML = '<div class="loading">جاري التحميل... ❄️</div>';
            const html = await fetchPage(url);
            if (!html) {
                contentArea.innerHTML = '<div class="loading">حدث خطأ أثناء التحميل، يرجى تحديث الصفحة. ❄️</div>';
                return;
            }
            const doc = parseHTML(html);
            const items = extractItems(doc, BASE_URL);
            renderGrid(items, 'series');
        }

        async function search() {
            const q = searchInput.value.trim();
            if (!q) return;
            contentArea.innerHTML = '<div class="loading">جاري البحث... ❄️</div>';
            const url = `search_results.php?q=${encodeURIComponent(q)}`;
            const html = await fetchPage(url);
            if (!html) {
                contentArea.innerHTML = '<div class="loading">حدث خطأ أثناء البحث، يرجى تحديث الصفحة. ❄️</div>';
                return;
            }
            const doc = parseHTML(html);
            const items = extractItems(doc, BASE_URL);
            renderGrid(items, 'mixed');
        }

        async function startRandomChannel() {
            contentArea.innerHTML = '<div class="loading">جاري اختيار كرتون عشوائي... ❄️</div>';
            const html = await fetchPage('cartoon.php');
            if (!html) return;
            const doc = parseHTML(html);
            const items = extractItems(doc, BASE_URL);
            if (items.length > 0) {
                const randomItem = items[Math.floor(Math.random() * items.length)];
                handleCardClick(randomItem, 'series');
            }
        }

        function renderGrid(items, type) {
            const grid = document.createElement('div');
            grid.className = 'grid';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.tabIndex = 0;
                card.innerHTML = `
                    <img src="${item.thumb || 'https://via.placeholder.com/200x300?text=No+Image'}" alt="${item.title}">
                    <div class="card-title">${item.title}</div>
                `;
                card.onclick = () => handleCardClick(item, type);
                card.onkeydown = (e) => { if(e.key === 'Enter') handleCardClick(item, type); };
                grid.appendChild(card);
            });
            contentArea.innerHTML = '';
            contentArea.appendChild(grid);
            grid.querySelector('.card')?.focus();
        }

        async function handleCardClick(item, type) {
            if (type === 'movies' || type === 'mixed') {
                playVideoFromPage(item.link);
            } else {
                loadEpisodes(item.link);
            }
        }

        async function loadEpisodes(url) {
            contentArea.innerHTML = '<div class="loading">جاري تحميل الحلقات... ❄️</div>';
            const html = await fetchPage(url);
            if (!html) {
                contentArea.innerHTML = '<div class="loading">حدث خطأ أثناء تحميل الحلقات، يرجى تحديث الصفحة. ❄️</div>';
                return;
            }
            const doc = parseHTML(html);
            const grid = doc.querySelector('.episodes-grid');
            if (!grid) {
                playVideoFromPage(url);
                return;
            }
            const episodes = [];
            grid.querySelectorAll('a[href]').forEach(ep => {
                episodes.push({
                    title: ep.getAttribute('title') || ep.innerText.trim() || "حلقة",
                    link: ep.getAttribute('href').startsWith('http') ? ep.getAttribute('href') : (url.endsWith('/') ? url + ep.getAttribute('href') : url + '/' + ep.getAttribute('href')),
                    thumb: ep.querySelector('img') ? ep.querySelector('img').getAttribute('src') : ''
                });
            });
            renderGrid(episodes, 'movies');
        }

        async function playVideoFromPage(url) {
            contentArea.innerHTML = '<div class="loading">جاري استخراج رابط التشغيل... ❄️</div>';
            const html = await fetchPage(url);
            if (!html) {
                contentArea.innerHTML = '<div class="loading">حدث خطأ في جلب صفحة الفيديو، يرجى تحديث الصفحة. ❄️</div>';
                return;
            }

            const mp4Regex = new RegExp('(https?://[^\\s\'"]+\\.mp4[^\\s\'"]*)');
            const srcRegex = new RegExp('const\\s+videoSrc\\s*=\\s*["\'](.*?)["\']');
            const mp4Match = html.match(mp4Regex);
            const srcMatch = html.match(srcRegex);
            let streamUrl = mp4Match ? mp4Match[1] : (srcMatch ? srcMatch[1] : null);
            if (streamUrl) {
                playVideo(streamUrl);
            } else {
                alert('عذراً، تعذر العثور على رابط الفيديو المباشر لهذه الصفحة.');
                loadSeries();
            }
        }

        function playVideo(url) {
            mainVideo.src = url;
            playerContainer.style.display = 'flex';
            mainVideo.play();
        }

        navBtns.forEach(btn => {
            btn.onclick = () => {
                navBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentView = btn.dataset.page;
                if (currentView === 'series') loadSeries();
                else if (currentView === 'movies') loadMovies();
                else if (currentView === 'letters') loadLetters();
                else if (currentView === 'random') startRandomChannel();
            };
        });

        logo.onclick = () => navBtns[0].click();
        searchBtn.onclick = search;
        closePlayer.onclick = () => {
            playerContainer.style.display = 'none';
            mainVideo.pause();
            mainVideo.src = '';
        };

        window.addEventListener('keydown', (e) => {
            const active = document.activeElement;
            if (!active || active === document.body) return;
            if (e.key === 'ArrowRight') moveFocus('prev');
            if (e.key === 'ArrowLeft') moveFocus('next');
            if (e.key === 'ArrowUp') moveFocus('up');
            if (e.key === 'ArrowDown') moveFocus('down');
            if (e.key === 'Backspace') {
                if (playerContainer.style.display === 'flex') closePlayer.click();
                else loadSeries();
            }
        });

        function moveFocus(dir) {
            const focusables = Array.from(document.querySelectorAll('[tabindex="0"]'));
            const idx = focusables.indexOf(document.activeElement);
            if (idx === -1) { focusables[0]?.focus(); return; }
            if (dir === 'next') focusables[idx + 1]?.focus();
            if (dir === 'prev') focusables[idx - 1]?.focus();
            if (dir === 'down') focusables[idx + 6]?.focus();
            if (dir === 'up') focusables[idx - 6]?.focus();
        }

        loadSeries();
    </script>
</body>
</html>
