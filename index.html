<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE TOONS - عالم الكرتون</title>
    <style>
        :root {
            --bg-dark: #0a0f1a;
            --bg-card: #16213e;
            --accent: #00d2ff;
            --accent-dark: #007bb5;
            --text-main: #e0f2f1;
            --text-dim: #b0bec5;
            --transition: all 0.3s ease;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        header {
            background: linear-gradient(to bottom, #1a2a4a, transparent);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .nav-btn {
            background: var(--bg-card);
            border: 2px solid transparent;
            color: var(--text-main);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: bold;
        }
        .nav-btn:focus, .nav-btn.active {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transform: scale(1.1);
            outline: none;
        }
        .container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            border: 3px solid transparent;
            position: relative;
            aspect-ratio: 2/3;
        }
        .card:focus, .card:hover {
            border-color: var(--accent);
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            outline: none;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 15px;
            font-size: 0.9rem;
            text-align: center;
            font-weight: bold;
        }
        .search-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .search-bar input {
            width: 60%;
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background: var(--bg-card);
            color: white;
            font-size: 1rem;
            outline: none;
            border: 2px solid transparent;
        }
        .search-bar input:focus {
            border-color: var(--accent);
        }
        .search-bar button {
            background: var(--accent);
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            color: var(--bg-dark);
            font-weight: bold;
            cursor: pointer;
        }
        .letter-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .letter-btn {
            width: 50px;
            height: 50px;
            background: var(--bg-card);
            border: 2px solid transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: var(--transition);
        }
        .letter-btn:focus, .letter-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dark);
            outline: none;
        }
        #player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        video {
            width: 100%;
            height: 100%;
            outline: none;
        }
        .close-player {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            z-index: 1100;
            font-weight: bold;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            color: var(--accent);
            margin: 50px 0;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .pagination button {
            background: var(--bg-card);
            border: 2px solid var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="app-logo">ICE TOONS</div>
        <nav>
            <button class="nav-btn active" data-page="series">المسلسلات</button>
            <button class="nav-btn" data-page="movies">الأفلام</button>
            <button class="nav-btn" data-page="letters">الحروف</button>
            <button class="nav-btn" data-page="random">قناة عشوائية</button>
        </nav>
    </header>

    <div class="container">
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="ابحث عن كرتونك المفضل...">
            <button id="search-btn">بحث</button>
        </div>

        <div id="content-area">
            <!-- Content will be injected here -->
        </div>
    </div>

    <div id="player-container">
        <button class="close-player" id="close-player">إغلاق ✖</button>
        <video id="main-video" controls autoplay></video>
    </div>

    <script>
        // --- الإعدادات ---
        const API_BASE = 'https://your-render-app-url.onrender.com'; // استبدل هذا برابط سيرفر Render الخاص بك
        
        let currentView = 'series';
        let currentPage = 1;
        let currentLetterUrl = '';

        const contentArea = document.getElementById('content-area');
        const logo = document.getElementById('app-logo');
        const navBtns = document.querySelectorAll('.nav-btn');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const playerContainer = document.getElementById('player-container');
        const mainVideo = document.getElementById('main-video');
        const closePlayer = document.getElementById('close-player');

        // --- وظائف الجلب ---
        async function fetchData(endpoint, params = {}) {
            const query = new URLSearchParams(params).toString();
            const url = `${API_BASE}${endpoint}${query ? '?' + query : ''}`;
            try {
                const response = await fetch(url);
                return await response.json();
            } catch (e) {
                console.error('Fetch error:', e);
                return null;
            }
        }

        async function loadSeries(page = 1) {
            currentPage = page;
            contentArea.innerHTML = '<div class="loading">جاري التحميل... ❄️</div>';
            const data = await fetchData('/api/series', { page });
            if (!data || !data.items) return;

            renderGrid(data.items, 'series');
            renderPagination(data.next_page, data.current_page);
        }

        async function loadMovies(page = 1) {
            currentPage = page;
            contentArea.innerHTML = '<div class="loading">جاري التحميل... ❄️</div>';
            const data = await fetchData('/api/movies', { page });
            if (!data || !data.items) return;

            renderGrid(data.items, 'movies');
            renderPagination(data.next_page, data.current_page);
        }

        async function loadLetters() {
            contentArea.innerHTML = '<div class="loading">جاري التحميل... ❄️</div>';
            const data = await fetchData('/api/letters');
            if (!data) return;

            const grid = document.createElement('div');
            grid.className = 'letter-grid';
            data.forEach(l => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.innerText = l.label;
                btn.onclick = () => loadByLetter(l.url);
                btn.tabIndex = 0;
                grid.appendChild(btn);
            });
            contentArea.innerHTML = '';
            contentArea.appendChild(grid);
        }

        async function loadByLetter(url) {
            contentArea.innerHTML = '<div class="loading">جاري التحميل... ❄️</div>';
            // نستخدم endpoint المسلسلات لكن نمرر url مخصص (هنا نحتاج تعديل بسيط في backend أو التعامل مع الـ url)
            // في هذا المثال الـ Backend يتوقع cartoon.php
            // سنقوم بتعديل الـ Backend ليدعم الـ url المباشر في api/series
            const data = await fetchData('/api/series', { url: url }); 
            // ملاحظة: إذا كان الـ Backend لا يدعم ?url= في /api/series، يمكن إنشاء endpoint جديد
            if (!data || !data.items) return;
            renderGrid(data.items, 'series');
        }

        async function search() {
            const q = searchInput.value.trim();
            if (!q) return;
            contentArea.innerHTML = '<div class="loading">جاري البحث... ❄️</div>';
            const data = await fetchData('/api/search', { q });
            if (!data || !data.items) return;
            renderGrid(data.items, 'mixed');
        }

        async function startRandomChannel() {
            contentArea.innerHTML = '<div class="loading">جاري البحث عن كرتون عشوائي... ❄️</div>';
            const data = await fetchData('/api/random');
            if (data && data.stream_url) {
                playVideo(data.stream_url, data.referer);
            } else {
                alert('عذراً، لم يتم العثور على فيديو عشوائي حالياً');
            }
        }

        // --- وظائف العرض ---
        function renderGrid(items, type) {
            const grid = document.createElement('div');
            grid.className = 'grid';
            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.tabIndex = 0;
                card.innerHTML = `
                    <img src="${item.thumb || 'https://via.placeholder.com/200x300?text=No+Image'}" alt="${item.title}">
                    <div class="card-title">${item.title}</div>
                `;
                card.onclick = () => handleCardClick(item, type);
                card.onkeydown = (e) => { if(e.key === 'Enter') handleCardClick(item, type); };
                grid.appendChild(card);
            });
            contentArea.innerHTML = '';
            contentArea.appendChild(grid);
            
            // Focus first item for TV navigation
            const firstCard = grid.querySelector('.card');
            if (firstCard) firstCard.focus();
        }

        function renderPagination(nextUrl, current) {
            if (!nextUrl) return;
            const pag = document.createElement('div');
            pag.className = 'pagination';
            const btn = document.createElement('button');
            btn.innerText = `الصفحة التالية (${current + 1})`;
            btn.onclick = () => {
                currentPage++;
                if (currentView === 'series') loadSeries(currentPage);
                else loadMovies(currentPage);
            };
            btn.tabIndex = 0;
            pag.appendChild(btn);
            contentArea.appendChild(pag);
        }

        async function handleCardClick(item, type) {
            if (type === 'movies' || type === 'mixed' && item.type === 'movie') {
                const playData = await fetchData('/api/play', { url: item.link });
                if (playData && playData.stream_url) {
                    playVideo(playData.stream_url, playData.referer);
                }
            } else {
                const epData = await fetchData('/api/episodes', { url: item.link });
                if (epData && epData.items) {
                    renderEpisodes(epData.items);
                }
            }
        }

        function renderEpisodes(items) {
            const grid = document.createElement('div');
            grid.className = 'grid';
            items.forEach(ep => {
                const card = document.createElement('div');
                card.className = 'card';
                card.tabIndex = 0;
                card.innerHTML = `
                    <img src="${ep.thumb || 'https://via.placeholder.com}'}" alt="${ep.title}">
                    <div class="card-title">${ep.title}</div>
                `;
                card.onclick = () => {
                    fetchData('/api/play', { url: ep.link }).then(data => {
                        if (data && data.stream_url) playVideo(data.stream_url, data.referer);
                    });
                };
                card.onkeydown = (e) => { if(e.key === 'Enter') handleCardClick(ep, 'movies'); };
                grid.appendChild(card);
            });
            contentArea.innerHTML = '';
            contentArea.appendChild(grid);
            grid.querySelector('.card')?.focus();
        }

        function playVideo(url, referer) {
            mainVideo.src = url;
            playerContainer.style.display = 'flex';
            mainVideo.play();
        }

        // --- التحكم ---
        navBtns.forEach(btn => {
            btn.onclick = () => {
                navBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentView = btn.dataset.page;
                if (currentView === 'series') loadSeries();
                else if (currentView === 'movies') loadMovies();
                else if (currentView === 'letters') loadLetters();
                else if (currentView === 'random') startRandomChannel();
            };
        });

        logo.onclick = () => {
            navBtns[0].click();
        };

        searchBtn.onclick = search;
        closePlayer.onclick = () => {
            playerContainer.style.display = 'none';
            mainVideo.pause();
            mainVideo.src = '';
        };

        // --- TV Navigation ---
        window.addEventListener('keydown', (e) => {
            const active = document.activeElement;
            if (!active || active === body) return;

            if (e.key === 'ArrowRight') moveFocus('prev');
            if (e.key === 'ArrowLeft') moveFocus('next');
            if (e.key === 'ArrowUp') moveFocus('up');
            if (e.key === 'ArrowDown') moveFocus('down');
            if (e.key === 'Backspace') {
                if (playerContainer.style.display === 'flex') {
                    closePlayer.click();
                } else {
                    // Simple back logic: return to main view if in episodes or letters
                    if (currentView === 'letters') loadSeries();
                    else loadSeries();
                }
            }
        });

        function moveFocus(dir) {
            const focusables = Array.from(document.querySelectorAll('[tabindex="0"]'));
            const idx = focusables.indexOf(document.activeElement);
            if (idx === -1) {
                focusables[0]?.focus();
                return;
            }
            if (dir === 'next') focusables[idx + 1]?.focus();
            if (dir === 'prev') focusables[idx - 1]?.focus();
            if (dir === 'up' || dir === 'down') {
                // Simple grid focus movement
                const rows = 6; 
                if (dir === 'down') focusables[idx + rows]?.focus();
                if (dir === 'up') focusables[idx - rows]?.focus();
            }
        }

        // Initial load
        loadSeries();
    </script>
</body>
</html>
